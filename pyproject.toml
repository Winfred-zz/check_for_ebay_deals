[tool.ruff]
target-version = "py312"
# No excludes, no per-file ignores, no `no-*` style suppressions:
# correctness rules only, formatting stays a separate deliberate change.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E5"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
